version: '3.8'

services:
  # RocketMQ Nameserver (Service Discovery)
  nameserver:
    image: apache/rocketmq:5.5.0
    platform: linux/amd64
    container_name: rocketmq-nameserver
    ports:
      - "9876:9876"  # Nameserver port
    command: sh mqnamesrv
    healthcheck: # Health check to ensure Nameserver is ready
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/9876" ]
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      - JAVA_OPT_EXT=-Xms64m -Xmx64m -Xmn32m -XX:MaxDirectMemorySize=64m -XX:MaxMetaspaceSize=96m

  # RocketMQ Broker (Message Storage)
  broker:
    image: apache/rocketmq:5.5.0
    platform: linux/amd64
    container_name: rocketmq-broker
    ports:
      - "10909:10909"  # Broker HA port
      - "10911:10911"  # Broker port
      - "10912:10912"  # Broker TLS port (optional)
    environment:
      - NAMESRV_ADDR=nameserver:9876  # Connect to nameserver
      - BROKER_CLUSTER_NAME=DefaultCluster
      - BROKER_NAME=broker-a
      - BROKER_ID=0
      - AUTO_CREATE_TOPIC_ENABLE=true  # Auto-create topics
      # Broker 2g + proxy 1g asks roughly 3.5 GB of a dev machine; turn these down if that is too
      # much locally.
      - JAVA_OPT_EXT=-Xms2g -Xmx2g -Xmn512m -XX:MaxDirectMemorySize=1g -XX:MaxMetaspaceSize=256m
    command: sh mqbroker
    depends_on:
      nameserver:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/10911" ]
      interval: 5s
      timeout: 10s
      retries: 10

  proxy:
    image: apache/rocketmq:5.5.0
    platform: linux/amd64
    container_name: rmqproxy
    depends_on:
      broker:
        condition: service_healthy
      nameserver:
        condition: service_healthy
    # The broker's healthcheck only proves its port is listening, not that it has registered with
    # the nameserver yet (that takes longer). The proxy crashes if it starts before registration
    # ("create system broadcast topic … failed") and otherwise has no way to come back - restarting
    # lets it come up again once the broker has registered, which it reliably has within a few
    # retries.
    restart: on-failure:5
    ports:
      - "8081:8081"   # HTTP endpoint (for REST API)
      - "9877:9877"   # gRPC endpoint (for clients)
    environment:
      - NAMESRV_ADDR=nameserver:9876
      - JAVA_OPT_EXT=-Xms1g -Xmx1g -Xmn256m -XX:MaxDirectMemorySize=512m -XX:MaxMetaspaceSize=256m
    command: sh mqproxy
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081" ]
      interval: 5s
      timeout: 10s
      retries: 10
    
  # Service to create the RocketMQ topics; the topic list lives in docker/RocketMQ/create-topics.sh
  create-topic:
    image: apache/rocketmq:5.5.0 # Use the same RocketMQ image to get mqadmin tool
    platform: linux/amd64
    volumes:
      - ./docker/RocketMQ/create-topics.sh:/create-topics.sh:ro
    command: > # Multi-line command to wait for the broker, then create the topics
      bash -c "
            echo 'Waiting for broker to be healthy...' &&
            until echo > /dev/tcp/broker/10911 2>/dev/null; do
              echo 'Broker not fully ready yet, retrying in 5 seconds...'
                sleep 5
            done;
            MQADMIN=$$(ls -d /home/rocketmq/rocketmq-*/bin/mqadmin | head -1) &&
            echo 'Waiting for the broker to register with the nameserver...' &&
            until $$MQADMIN clusterList -n nameserver:9876 2>/dev/null | grep -q '^DefaultCluster'; do
              sleep 5
            done;
            echo 'Broker is up.' &&
            bash /create-topics.sh
        "
    depends_on: # Ensure broker is healthy before attempting topic creation
      broker:
        condition: service_healthy
      nameserver:
        condition: service_healthy
    restart: "no" # This service should run once and then exit
    
  # RocketMQ Dashboard (Web UI - Optional)
  dashboard:
    image: apacherocketmq/rocketmq-dashboard
    # platform: linux/amd64
    container_name: rocketmq-dashboard
    ports:
      - "8082:8082"  # Dashboard UI port
    environment:
      - NAMESRV_ADDR=nameserver:9876  # Connect to nameserver
    depends_on:
      - nameserver
      - broker
