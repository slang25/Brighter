# floci-gcp's Pub/Sub for the transport conformance tests.
#
# The Gcp.Tests providers use EmulatorDetection.EmulatorOrProduction, which honours
# the PUBSUB_EMULATOR_HOST environment variable. Export these before running the suite:
#
#   export PUBSUB_EMULATOR_HOST=localhost:8085
#   export GOOGLE_CLOUD_PROJECT=brighter-test
#
# floci-gcp serves Pub/Sub on 4588; it's published on 8085, the port the tests and docs already use.
#
# CI runs most GCP tests against *real* GCP (the gcp-ci job in .github/workflows/ci.yml). The Pull and
# PullOrdering messaging tests run against this same emulator image in the gcp-emulator-ci job.
services:
  floci-gcp:
    image: floci/floci-gcp:0.12.0
    container_name: floci-gcp
    ports:
      - "8085:4588"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
