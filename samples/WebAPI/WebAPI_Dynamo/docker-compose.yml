version: '3.1'
services:
  floci:
    # Floci serves DynamoDB on 4566; the sample addresses it at localhost:8000.
    image: floci/floci:2.2.0
    container_name: floci
    environment:
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
    ports:
      - "8000:4566"
    volumes:
      - "./docker/floci:/app/data"
    
  rabbitmq:
    image: brightercommand/rabbitmq:4.2-management-delay
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-home:/var/lib/rabbitmq

volumes:
    rabbitmq-home:
      driver: local
 
